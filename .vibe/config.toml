# Project-local Vibe configuration.
# Loads this collection's skills into Vibe's discovery.
# Workflow skills live flat under .agents/skills/
# (<dir>/<skill-name>/SKILL.md), so the directory alone covers them.
# Role skills keep their category subdirectories under .agents/agents/,
# so each category directory is listed explicitly.

skill_paths = [
  # Workflow skills
  ".agents/skills",
  # Agent role skills
  ".agents/agents",
  ".agents/agents/design",
  ".agents/agents/development",
  ".agents/agents/testing",
  ".agents/agents/documentation",
  ".agents/agents/rules",
]
